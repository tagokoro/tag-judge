name: CI

on:
  pull_request:
  push:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: judge_test
          POSTGRES_PASSWORD: judge_test
          POSTGRES_DB: judge_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U judge_test -d judge_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Test backend
        env:
          SUBMISSION_DETAILS_TEST_DATABASE_URL: postgres://judge_test:judge_test@localhost:5432/judge_test?sslmode=disable
        run: go test ./...

  rust:
    name: Rust fmt and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check judge-core formatting
        run: cargo fmt --check
        working-directory: judge/core

      - name: Test judge-core
        run: cargo test
        working-directory: judge/core

      - name: Check judge-worker formatting
        run: cargo fmt --check
        working-directory: judge/worker

      - name: Test judge-worker
        run: cargo test
        working-directory: judge/worker
