name: CI

on:
  pull_request:
  push:

jobs:
  rust:
    name: Rust fmt and tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check judge-core formatting
        run: cargo fmt --check
        working-directory: judge/core

      - name: Test judge-core
        run: cargo test
        working-directory: judge/core

      - name: Check judge-worker formatting
        run: cargo fmt --check
        working-directory: judge/worker

      - name: Test judge-worker
        run: cargo test
        working-directory: judge/worker
