services:
  postgres:
    image: postgres:16
    container_name: judge-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-judge}
      POSTGRES_USER: ${POSTGRES_USER:-judge_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-judge_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  localstack:
    image: localstack/localstack:3
    container_name: judge-localstack
    environment:
      SERVICES: sqs,s3
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-ap-northeast-1}
    ports:
      - "${LOCALSTACK_PORT:-4566}:4566"
    volumes:
      - ./localstack/init:/etc/localstack/init/ready.d:ro
    healthcheck:
      test: ["CMD-SHELL", "awslocal sqs list-queues >/dev/null 2>&1 && awslocal s3 ls >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 10

  judge-runner:
    build:
      context: .
      dockerfile: docker/judge-runner/Dockerfile
    container_name: judge-runner
    privileged: true
    working_dir: /workspace
    environment:
      CARGO_HOME: /cargo
      CARGO_TARGET_DIR: /cargo-target
    volumes:
      - ./judge:/workspace/judge
      - judge_runner_cargo:/cargo
      - judge_runner_target:/cargo-target

volumes:
  postgres_data:
  judge_runner_cargo:
  judge_runner_target:
