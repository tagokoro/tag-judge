openapi: 3.1.0
info:
  title: Tag Judge API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/google/login:
    get:
      summary: Start Google OAuth login
      responses:
        "302":
          description: Redirects to Google's OAuth consent screen.
        "500":
          $ref: "#/components/responses/Error"
  /auth/google/callback:
    get:
      summary: Complete Google OAuth login
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Creates a session cookie and redirects to the configured success URL.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      summary: Revoke current session
      security:
        - CookieAuth: []
      responses:
        "204":
          description: Session revoked.
  /me:
    get:
      summary: Get current authenticated actor
      description: Uses the session cookie. During local development, X-User-ID and X-User-Role are also accepted when DEV_HEADER_AUTH=true.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      responses:
        "200":
          description: Current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /problems:
    get:
      summary: List public problems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Public problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemListResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a problem
      description: Authors and admins create problem metadata separately from test cases. New problems must be private or group; group association is not handled in this API version.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProblemRequest"
      responses:
        "201":
          description: Problem created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}:
    get:
      summary: Get a public problem
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Public problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a problem
      description: The owning author or an administrator can update a problem. A problem requires at least one test case before it can be public.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProblemRequest"
      responses:
        "200":
          description: Updated problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a problem
      description: The owning author or an administrator can delete a problem. Its test cases are deleted automatically.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
      responses:
        "204":
          description: Problem deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}/test-cases:
    get:
      summary: List test cases
      description: Expected outputs are available only to the owning author or an administrator.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
      responses:
        "200":
          description: Test cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCaseListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a test case
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestCaseRequest"
      responses:
        "201":
          description: Test case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCaseResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}/test-cases/{test_case_id}:
    patch:
      summary: Update a test case
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
        - $ref: "#/components/parameters/TestCaseIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestCaseRequest"
      responses:
        "200":
          description: Updated test case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCaseResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a test case
      description: The last test case of a public problem cannot be deleted.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
        - $ref: "#/components/parameters/TestCaseIDPath"
      responses:
        "204":
          description: Test case deleted
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}/submissions:
    post:
      summary: Create a submission for a public problem
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: problem_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: Submission created in pending state and queued for judging
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /submissions:
    get:
      summary: List the current user's submissions
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Current user's submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /submissions/{submission_id}:
    get:
      summary: Get a submission with case results
      description: |
        The owner and administrators can view a submission and its saved case results.
        Pending and running submissions return an empty case_results array; poll this
        endpoint until the status is terminal. Hidden test inputs, expected output,
        stdout, and stderr are never included, including for administrators.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: submission_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Submission and saved case results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetailResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /code-runs:
    post:
      summary: Create a code run
      description: Stores a Python code run with pending status and dispatches a stdin execution job.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCodeRunRequest"
      responses:
        "201":
          description: Created code run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
    get:
      summary: List the current user's code runs
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Current user's code runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /code-runs/{code_run_id}:
    get:
      summary: Get a code run
      description: The owner can view the code run. An admin can view any code run.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: code_run_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Code run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /groups:
    post:
      summary: Create a group
      description: Creates a group and registers the authenticated author or admin as its owner.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    get:
      summary: List groups for the authenticated user
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      responses:
        "200":
          description: Groups where the authenticated user is a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
        "401":
          $ref: "#/components/responses/Error"
  /groups/{group_id}:
    get:
      summary: Get a group
      description: Requires group membership. Admins may access any group.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/GroupIDPath"
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /groups/{group_id}/members:
    post:
      summary: Add a group member
      description: Requires group owner membership. Admins may add members to any group.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/GroupIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupMemberRequest"
      responses:
        "201":
          description: Group member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /namespaces:
    post:
      summary: Create the caller's personal namespace
      description: |-
        A user owns at most one namespace. The slug is chosen once and never
        changes.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateNamespaceRequest"
      responses:
        "201":
          description: Namespace created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /me/namespace:
    get:
      summary: Get the caller's own namespace
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Own namespace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceResponse"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /namespaces/{namespace_slug}:
    get:
      summary: Get a namespace public profile
      description: Publicly readable without authentication.
      parameters:
        - name: namespace_slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Namespace profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NamespaceResponse"
        "404":
          $ref: "#/components/responses/Error"
  /namespaces/{namespace_slug}/libraries:
    get:
      summary: List libraries in a namespace
      description: |-
        The namespace owner sees public and private libraries; everyone else
        sees only public libraries. Results are ordered by created_at DESC then
        slug ASC.
      parameters:
        - name: namespace_slug
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Libraries visible to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a library in a namespace
      security:
        - CookieAuth: []
      parameters:
        - name: namespace_slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: Library created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /namespaces/{namespace_slug}/libraries/{library_slug}/versions:
    get:
      summary: List library version summaries
      description: |-
        Summaries never include source_code. Ordered by version_number DESC.
      parameters:
        - name: namespace_slug
          in: path
          required: true
          schema:
            type: string
        - name: library_slug
          in: path
          required: true
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Version summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryVersionListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Create an immutable library version
      description: |-
        The version number is assigned by the system starting at 1. Version
        content can never be changed or deleted afterwards.
      security:
        - CookieAuth: []
      parameters:
        - name: namespace_slug
          in: path
          required: true
          schema:
            type: string
        - name: library_slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryVersionRequest"
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryVersionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /namespaces/{namespace_slug}/libraries/{library_slug}/versions/{version_number}:
    get:
      summary: Get one library version with its source
      parameters:
        - name: namespace_slug
          in: path
          required: true
          schema:
            type: string
        - name: library_slug
          in: path
          required: true
          schema:
            type: string
        - name: version_number
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Library version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryVersionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /namespaces/{namespace_slug}/libraries/{library_slug}:
    get:
      summary: Get one library
      description: Private libraries return 404 for everyone except the owner.
      parameters:
        - name: namespace_slug
          in: path
          required: true
          schema:
            type: string
        - name: library_slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update library name, description, or visibility
      description: Only the namespace owner may update a library.
      security:
        - CookieAuth: []
      parameters:
        - name: namespace_slug
          in: path
          required: true
          schema:
            type: string
        - name: library_slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryRequest"
      responses:
        "200":
          description: Library updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /namespaces/{namespace_slug}/libraries/{library_slug}/versions/{version_number}/verifications:
    post:
      summary: Start library verification
      security: [{CookieAuth: []}]
      parameters:
        - {name: namespace_slug, in: path, required: true, schema: {type: string}}
        - {name: library_slug, in: path, required: true, schema: {type: string}}
        - {name: version_number, in: path, required: true, schema: {type: integer, minimum: 1}}
      requestBody:
        required: true
        content:
          application/json: {schema: {$ref: '#/components/schemas/CreateVerificationRequest'}}
      responses:
        '201': {description: Verification created, content: {application/json: {schema: {$ref: '#/components/schemas/VerificationCreateResponse'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}
        '409': {$ref: '#/components/responses/Error'}

  /library-verifications/{verification_id}:
    get:
      summary: Get verification detail
      security: [{CookieAuth: []}]
      parameters:
        - {name: verification_id, in: path, required: true, schema: {type: integer, minimum: 1}}
      responses:
        '200': {description: Verification detail, content: {application/json: {schema: {$ref: '#/components/schemas/VerificationDetailResponse'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}
        '403': {$ref: '#/components/responses/Error'}
        '404': {$ref: '#/components/responses/Error'}

  /library-verifications:
    get:
      summary: List current user's verifications
      security: [{CookieAuth: []}]
      parameters:
        - {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100}}
        - {name: offset, in: query, schema: {type: integer, minimum: 0}}
      responses:
        '200': {description: Verifications, content: {application/json: {schema: {$ref: '#/components/schemas/VerificationListResponse'}}}}
        '400': {$ref: '#/components/responses/Error'}
        '401': {$ref: '#/components/responses/Error'}

components:
  parameters:
    UserIDHeader:
      name: X-User-ID
      in: header
      required: false
      description: Development-only authentication header enabled by DEV_HEADER_AUTH=true.
      schema:
        type: string
        format: uuid
    UserRoleHeader:
      name: X-User-Role
      in: header
      required: false
      description: Development-only authentication header enabled by DEV_HEADER_AUTH=true.
      schema:
        type: string
        enum: [user, author, admin]
    GroupIDPath:
      name: group_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProblemIDPath:
      name: problem_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TestCaseIDPath:
      name: test_case_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: tag_judge_session
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateProblemRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - statement
        - time_limit_ms
        - memory_limit_kb
        - visibility
      properties:
        title:
          type: string
          minLength: 1
        statement:
          type: string
          minLength: 1
          description: Markdown or TeX source stored without transformation.
        time_limit_ms:
          type: integer
          minimum: 1
          maximum: 2147483647
        memory_limit_kb:
          type: integer
          minimum: 1
          maximum: 2147483647
        visibility:
          type: string
          enum: [private, group]
          description: Add at least one test case before changing visibility to public.
    UpdateProblemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        statement:
          type: string
          minLength: 1
        time_limit_ms:
          type: integer
          minimum: 1
          maximum: 2147483647
        memory_limit_kb:
          type: integer
          minimum: 1
          maximum: 2147483647
        visibility:
          type: string
          enum: [public, private, group]
    CreateTestCaseRequest:
      type: object
      additionalProperties: false
      required: [input, expected_output, is_sample]
      properties:
        input:
          type: string
        expected_output:
          type: string
        is_sample:
          type: boolean
    UpdateTestCaseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        input:
          type: string
        expected_output:
          type: string
        is_sample:
          type: boolean
    TestCase:
      type: object
      required: [id, problem_id, input, expected_output, is_sample, score, created_at]
      properties:
        id:
          type: integer
          format: int64
        problem_id:
          type: integer
          format: int64
        input:
          type: string
        expected_output:
          type: string
        is_sample:
          type: boolean
        score:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    TestCaseResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/TestCase"
    TestCaseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TestCase"
