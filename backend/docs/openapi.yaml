openapi: 3.1.0
info:
  title: Tag Judge API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /me:
    get:
      summary: Get current authenticated actor
      description: Uses development header authentication until Google OAuth session support is implemented.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      responses:
        "200":
          description: Current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /problems:
    get:
      summary: List public problems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Public problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemListResponse"
        "400":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}:
    get:
      summary: Get a public problem
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Public problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /code-runs:
    post:
      summary: Create a code run
      description: Stores a Python code run with pending status. Execution is handled separately.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCodeRunRequest"
      responses:
        "201":
          description: Created code run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
    get:
      summary: List the current user's code runs
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Current user's code runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /code-runs/{code_run_id}:
    get:
      summary: Get a code run
      description: The owner can view the code run. An admin can view any code run.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: code_run_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Code run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    UserIDHeader:
      name: X-User-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    UserRoleHeader:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        enum: [user, author, admin]
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Problem:
      type: object
      required:
        - id
        - title
        - statement
        - time_limit_ms
        - memory_limit_kb
        - visibility
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        statement:
          type: string
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        visibility:
          type: string
          enum: [public, private, group]
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProblemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Problem"
    Me:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, author, admin]
    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Me"
    ProblemListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
    CreateCodeRunRequest:
      type: object
      additionalProperties: false
      required:
        - language
        - source_code
      properties:
        language:
          type: string
          enum: [python]
        source_code:
          type: string
          minLength: 1
        stdin:
          type: string
          default: ""
    CodeRun:
      type: object
      required:
        - id
        - user_id
        - language
        - source_code
        - stdin
        - stdout
        - stderr
        - status
        - execution_time_ms
        - memory_kb
        - created_at
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
        language:
          type: string
          enum: [python]
        source_code:
          type: string
        stdin:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        status:
          type: string
          enum: [pending, running, ac, tle, re, ie]
        execution_time_ms:
          type: [integer, "null"]
          minimum: 0
        memory_kb:
          type: [integer, "null"]
          minimum: 0
        created_at:
          type: string
          format: date-time
    CodeRunResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CodeRun"
    CodeRunListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CodeRun"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
