      type: object
      additionalProperties: false
      required:
        - language
        - source_code
      properties:
        language:
          type: string
          enum: [python]
        source_code:
          type: string
          minLength: 1
    Submission:
      type: object
      required:
        - id
        - user_id
        - problem_id
        - language
        - source_code_key
        - status
        - score
        - created_at
        - judged_at
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
        problem_id:
          type: integer
          format: int64
        language:
          type: string
          enum: [python]
        source_code_key:
          type: string
        status:
          type: string
          enum: [pending, running, ac, wa, tle, mle, re, ce, ie]
        score:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        judged_at:
          type: [string, "null"]
          format: date-time
    SubmissionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Submission"
    SubmissionCaseResult:
      type: object
      additionalProperties: false
      required: [test_case_id, status, execution_time_ms, memory_kb]
      properties:
        test_case_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [ac, wa, tle, mle, re, ce, ie]
        execution_time_ms:
          type: [integer, "null"]
          minimum: 0
          description: Execution time in milliseconds, or null if not recorded. Zero is a valid recorded value.
        memory_kb:
          type: [integer, "null"]
          minimum: 0
          description: Memory usage in KiB, or null if not recorded. The current worker does not record this metric.
    SubmissionDetail:
      allOf:
        - $ref: "#/components/schemas/Submission"
        - type: object
          required: [case_results]
          properties:
            case_results:
              type: array
              description: |
                Saved results ordered by test_case_id ascending. Empty for pending/running
                submissions or when no cases ran (for example an early internal error).
                Cases not executed after an early failure are omitted.
              items:
                $ref: "#/components/schemas/SubmissionCaseResult"
    SubmissionDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SubmissionDetail"
    SubmissionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
