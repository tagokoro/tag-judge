        adapter_source: {type: string, minLength: 1, maxLength: 100000}
    VerificationCaseResult:
      type: object
      required: [test_case_id, status]
      properties:
         test_case_id: {type: integer, minimum: 1}
         status: {type: string, enum: [pending, running, ac, wa, tle, mle, re, ce, ie]}
         execution_time_ms: {type: integer, minimum: 0, nullable: true}
         memory_kb: {type: integer, minimum: 0, nullable: true}
    VerificationSummary:
      type: object
      required: [id, library_version_id, namespace_slug, library_slug, version_number, problem_id, submission_id, status, score, adapter_sha256, created_at, judged_at]
      properties:
        id: {type: integer}
        library_version_id: {type: string}
        namespace_slug: {type: string}
        library_slug: {type: string}
        version_number: {type: integer, minimum: 1}
        problem_id: {type: integer}
        submission_id: {type: integer}
        status: {type: string, enum: [pending, running, ac, wa, tle, mle, re, ce, ie]}
        score: {type: integer, minimum: 0, maximum: 100}
        adapter_sha256: {type: string, minLength: 64, maxLength: 64, pattern: '^[0-9a-f]{64}$'}
        created_at: {type: string, format: date-time}
        judged_at: {type: string, format: date-time, nullable: true}
    VerificationDetail:
      allOf:
        - $ref: '#/components/schemas/VerificationSummary'
        - type: object
          required: [adapter_source, case_results]
          properties:
            adapter_source: {type: string, minLength: 1, maxLength: 100000}
            case_results: {type: array, items: {$ref: '#/components/schemas/VerificationCaseResult'}}
    VerificationCreateResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/VerificationSummary'}
    VerificationDetailResponse:
      type: object
      required: [data]
      properties:
        data: {$ref: '#/components/schemas/VerificationDetail'}
    VerificationListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: {$ref: '#/components/schemas/VerificationSummary'}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
