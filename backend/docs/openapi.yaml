openapi: 3.1.0
info:
  title: Tag Judge API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /me:
    get:
      summary: Get current authenticated actor
      description: Uses development header authentication until Google OAuth session support is implemented.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      responses:
        "200":
          description: Current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /problems:
    get:
      summary: List public problems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Public problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemListResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a problem
      description: Authors and admins can create a problem with its test cases. Group visibility does not associate a group in this API version.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProblemRequest"
      responses:
        "201":
          description: Problem created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}:
    get:
      summary: Get a public problem
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Public problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    UserIDHeader:
      name: X-User-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    UserRoleHeader:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        enum: [user, author, admin]
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateProblemRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - statement
        - time_limit_ms
        - memory_limit_kb
        - visibility
        - test_cases
      properties:
        title:
          type: string
          minLength: 1
        statement:
          type: string
          minLength: 1
          description: Markdown or TeX source stored without transformation.
        time_limit_ms:
          type: integer
          minimum: 1
          maximum: 2147483647
        memory_limit_kb:
          type: integer
          minimum: 1
          maximum: 2147483647
        visibility:
          type: string
          enum: [public, private, group]
        test_cases:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/CreateTestCaseRequest"
    CreateTestCaseRequest:
      type: object
      additionalProperties: false
      required: [input, expected_output, is_sample]
      properties:
        input:
          type: string
        expected_output:
          type: string
        is_sample:
          type: boolean
    Problem:
      type: object
      required:
        - id
        - title
        - statement
        - time_limit_ms
        - memory_limit_kb
        - visibility
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        statement:
          type: string
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        visibility:
          type: string
          enum: [public, private, group]
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProblemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Problem"
    Me:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, author, admin]
    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Me"
    ProblemListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
