openapi: 3.1.0
info:
  title: Tag Judge API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /me:
    get:
      summary: Get current authenticated actor
      description: Uses development header authentication until Google OAuth session support is implemented.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      responses:
        "200":
          description: Current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /problems:
    get:
      summary: List public problems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Public problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemListResponse"
        "400":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}:
    get:
      summary: Get a public problem
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Public problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /groups:
    post:
      summary: Create a group
      description: Creates a group and registers the authenticated author or admin as its owner.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    get:
      summary: List groups for the authenticated user
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      responses:
        "200":
          description: Groups where the authenticated user is a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
        "401":
          $ref: "#/components/responses/Error"
  /groups/{group_id}:
    get:
      summary: Get a group
      description: Requires group membership. Admins may access any group.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/GroupIDPath"
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /groups/{group_id}/members:
    post:
      summary: Add a group member
      description: Requires group owner membership. Admins may add members to any group.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/GroupIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupMemberRequest"
      responses:
        "201":
          description: Group member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
components:
  parameters:
    UserIDHeader:
      name: X-User-ID
      in: header
      required: true
      schema:
        type: string
        format: uuid
    UserRoleHeader:
      name: X-User-Role
      in: header
      required: true
      schema:
        type: string
        enum: [user, author, admin]
    GroupIDPath:
      name: group_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          default: ""
    AddGroupMemberRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [member, owner]
    Group:
      type: object
      required:
        - id
        - name
        - description
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GroupMember:
      type: object
      required:
        - group_id
        - user_id
        - role
        - created_at
      properties:
        group_id:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [member, owner]
        created_at:
          type: string
          format: date-time
    GroupResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Group"
    GroupListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Group"
    GroupMemberResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/GroupMember"
    Problem:
      type: object
      required:
        - id
        - title
        - statement
        - time_limit_ms
        - memory_limit_kb
        - visibility
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        statement:
          type: string
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        visibility:
          type: string
          enum: [public, private, group]
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProblemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Problem"
    Me:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, author, admin]
    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Me"
    ProblemListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
