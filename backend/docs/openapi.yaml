openapi: 3.1.0
info:
  title: Tag Judge API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/google/login:
    get:
      summary: Start Google OAuth login
      responses:
        "302":
          description: Redirects to Google's OAuth consent screen.
        "500":
          $ref: "#/components/responses/Error"
  /auth/google/callback:
    get:
      summary: Complete Google OAuth login
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: Creates a session cookie and redirects to the configured success URL.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      summary: Revoke current session
      security:
        - CookieAuth: []
      responses:
        "204":
          description: Session revoked.
  /me:
    get:
      summary: Get current authenticated actor
      description: Uses the session cookie. During local development, X-User-ID and X-User-Role are also accepted when DEV_HEADER_AUTH=true.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      responses:
        "200":
          description: Current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /problems:
    get:
      summary: List public problems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Public problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemListResponse"
        "400":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}:
    get:
      summary: Get a public problem
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Public problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
components:
  parameters:
    UserIDHeader:
      name: X-User-ID
      in: header
      required: false
      description: Development-only authentication header enabled by DEV_HEADER_AUTH=true.
      schema:
        type: string
        format: uuid
    UserRoleHeader:
      name: X-User-Role
      in: header
      required: false
      description: Development-only authentication header enabled by DEV_HEADER_AUTH=true.
      schema:
        type: string
        enum: [user, author, admin]
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: tag_judge_session
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Problem:
      type: object
      required:
        - id
        - title
        - statement
        - time_limit_ms
        - memory_limit_kb
        - visibility
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        statement:
          type: string
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        visibility:
          type: string
          enum: [public, private, group]
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProblemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Problem"
    Me:
      type: object
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [user, author, admin]
    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Me"
    ProblemListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
            message:
              type: string
