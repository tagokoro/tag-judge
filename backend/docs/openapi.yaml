        source_code:
          type: string
        stdin:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        status:
          type: string
          enum: [pending, running, ac, tle, re, ie]
        execution_time_ms:
          type: [integer, "null"]
          minimum: 0
        memory_kb:
          type: [integer, "null"]
          minimum: 0
        created_at:
          type: string
