openapi: 3.1.0
info:
  title: Tag Judge API
  version: 0.1.0
servers:
  - url: /api/v1
paths:
  /auth/google/login:
    get:
      summary: Start Google OAuth login
      responses:
        "302":
          description: Redirects to Google's OAuth consent screen.
        "500":
          $ref: "#/components/responses/Error"
  /auth/google/callback:
    get:
      summary: Complete Google OAuth login
      parameters:
        - name: code
          in: query
          required: true
          schema:
            type: string
        - name: state
          in: query
          required: true
          schema:
            type: string
      responses:
        "302":
          description: |-
            Creates a session cookie. Redirects to /signup on the
            origin of AUTH_SUCCESS_REDIRECT_URL when the user has no handle yet,
            and to AUTH_SUCCESS_REDIRECT_URL otherwise.
          headers:
            Set-Cookie:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/Error"
        "500":
          $ref: "#/components/responses/Error"
  /auth/logout:
    post:
      summary: Revoke current session
      security:
        - CookieAuth: []
      responses:
        "204":
          description: Session revoked.
  /me:
    get:
      summary: Get current authenticated actor
      description: Uses the session cookie. During local development, X-User-ID and X-User-Role are also accepted when DEV_HEADER_AUTH=true.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      responses:
        "200":
          description: Current actor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
        "401":
          $ref: "#/components/responses/Error"
  /problems:
    get:
      summary: List public problems
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Public problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemListResponse"
        "400":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a problem
      description: Authors and admins create problem metadata separately from test cases. New problems must be private or group; group association is not handled in this API version. 409 HANDLE_REQUIRED when the caller has no handle yet.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProblemRequest"
      responses:
        "201":
          description: Problem created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}:
    get:
      summary: Get a public problem
      parameters:
        - name: problem_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Public problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a problem
      description: The owning author or an administrator can update a problem. A problem requires at least one test case before it can be public.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProblemRequest"
      responses:
        "200":
          description: Updated problem
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a problem
      description: The owning author or an administrator can delete a problem. Its test cases are deleted automatically.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
      responses:
        "204":
          description: Problem deleted
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}/test-cases:
    get:
      summary: List test cases
      description: Expected outputs are available only to the owning author or an administrator.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
      responses:
        "200":
          description: Test cases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCaseListResponse"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Create a test case
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTestCaseRequest"
      responses:
        "201":
          description: Test case created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCaseResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}/test-cases/{test_case_id}:
    patch:
      summary: Update a test case
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
        - $ref: "#/components/parameters/TestCaseIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateTestCaseRequest"
      responses:
        "200":
          description: Updated test case
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestCaseResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Delete a test case
      description: The last test case of a public problem cannot be deleted.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/ProblemIDPath"
        - $ref: "#/components/parameters/TestCaseIDPath"
      responses:
        "204":
          description: Test case deleted
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /problems/{problem_id}/submissions:
    post:
      summary: Create a submission for a public problem
      description: |
        Creates a pending submission and records a durable outbox entry so the
        job is dispatched even if SQS is temporarily unavailable. The source
        code is stored before the admission decision; a rejected request may
        leave an orphan artifact.

        Supplying an `Idempotency-Key` header allows safe retry when the HTTP
        response is lost. Replays with the same key and identical normalized
        input return the same submission. A different body for the same key
        returns `409`. Without a key, duplicate submissions are possible on
        retry.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
        - name: problem_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubmissionRequest"
      responses:
        "201":
          description: Submission created in pending state and queued for judging
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
  /submissions:
    get:
      summary: List the current user's submissions
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Current user's submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /submissions/recent:
    get:
      summary: List recent submissions to public problems
      description: |
        Anyone may call this. Only submissions to public problems are listed,
        newest first. No source code key and no user id are returned; the
        submitter is shown by their handle, or null when they have none.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Recent public submissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicSubmissionListResponse"
        "400":
          $ref: "#/components/responses/Error"
  /submissions/{submission_id}:
    get:
      summary: Get a submission with case results
      description: |
        The owner and administrators can view a submission and its saved case results.
        Pending and running submissions return an empty case_results array; poll this
        endpoint until the status is terminal. Hidden test inputs, expected output,
        stdout, and stderr are never included, including for administrators.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: submission_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Submission and saved case results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubmissionDetailResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /code-runs:
    post:
      summary: Create a code run
      description: |
        Reserves a CodeRun ID, stores the source artifact, and then atomically
        creates the pending CodeRun record and durable outbox entry. Because the
        artifact exists before the record is committed, dispatch can never
        precede artifact availability. A storage failure before admission
        creates no CodeRun or outbox row. A rejected admission decision or an
        idempotent replay of an existing key may leave a pre-stored artifact
        without a referencing CodeRun; such unreferenced artifacts are retained
        until a future cleanup job removes them.

        Supplying an `Idempotency-Key` header allows safe retry when the HTTP
        response is lost. Replays with the same key and identical normalized
        input return the same code run. A different body for the same key
        returns `409`. Without a key, duplicate code runs are possible on retry.

        CodeRun execution is not yet implemented in the Rust worker; the
        durable outbox and admission counts still treat pending CodeRuns as
        outstanding work.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCodeRunRequest"
      responses:
        "201":
          description: Created code run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
        "429":
          $ref: "#/components/responses/RateLimitError"
        "500":
          $ref: "#/components/responses/Error"
        "503":
          $ref: "#/components/responses/ServiceUnavailableError"
    get:
      summary: List the current user's code runs
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Current user's code runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /code-runs/{code_run_id}:
    get:
      summary: Get a code run
      description: The owner can view the code run. An admin can view any code run.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: code_run_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        "200":
          description: Code run
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CodeRunResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /groups:
    post:
      summary: Create a group
      description: Creates a group and registers the authenticated author or admin as its owner.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGroupRequest"
      responses:
        "201":
          description: Group created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
    get:
      summary: List groups for the authenticated user
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
      responses:
        "200":
          description: Groups where the authenticated user is a member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupListResponse"
        "401":
          $ref: "#/components/responses/Error"
  /groups/{group_id}:
    get:
      summary: Get a group
      description: Requires group membership. Admins may access any group.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/GroupIDPath"
      responses:
        "200":
          description: Group details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /groups/{group_id}/members:
    post:
      summary: Add a group member
      description: Requires group owner membership. Admins may add members to any group.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - $ref: "#/components/parameters/GroupIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddGroupMemberRequest"
      responses:
        "201":
          description: Group member added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupMemberResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /libraries:
    get:
      summary: List public libraries across every user and category
      description: Anyone may call this. Private libraries are never listed. Ordered by created_at DESC.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Public libraries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryListResponse"
        "400":
          $ref: "#/components/responses/Error"
  /me/problems:
    get:
      summary: List the problems the current user created
      description: Includes private problems. Newest first.
      parameters:
        - $ref: "#/components/parameters/UserIDHeader"
        - $ref: "#/components/parameters/UserRoleHeader"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        "200":
          description: Current user's problems
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProblemListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
  /me/profile:
    post:
      summary: Create the caller's handle
      description: |-
        Run once, from the /signup page. The handle is the user's only
        name; it is chosen once and never changes. 409 HANDLE_ALREADY_SET when
        the caller already has a handle; 409 HANDLE_TAKEN when another user
        uses it.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProfileRequest"
      responses:
        "201":
          description: Profile created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /me/libraries:
    post:
      summary: Create a library under one of the caller's categories
      description: |-
        category names the caller's category to file the library under: the
        caller's category with that name (ignoring letter case) is used, or a
        new one is created in the same transaction. 409 HANDLE_REQUIRED when
        the caller has no handle; 409 CATEGORY_LIMIT when a new category would
        be the 21st. 400 INVALID_CATEGORY for a bad category name.
      security:
        - CookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryRequest"
      responses:
        "201":
          description: Library created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /me/categories:
    get:
      summary: List the caller's own categories
      description: Includes empty categories and categories with only private libraries. Ordered by created_at ASC.
      security:
        - CookieAuth: []
      responses:
        "200":
          description: Own categories
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "401":
          $ref: "#/components/responses/Error"
  /users/{handle}:
    get:
      summary: Get a user's public profile
      description: Publicly readable. Never includes the user id, email, or Google account name.
      parameters:
        - $ref: "#/components/parameters/HandlePath"
      responses:
        "200":
          description: User profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfileResponse"
        "404":
          $ref: "#/components/responses/Error"
  /users/{handle}/categories:
    get:
      summary: List a user's categories
      description: |-
        The user themself sees every category; everyone else sees only
        categories that contain at least one public library. Ordered by
        created_at ASC.
      parameters:
        - $ref: "#/components/parameters/HandlePath"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
      responses:
        "200":
          description: Categories visible to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /categories/{category_id}:
    get:
      summary: Get a category
      description: |-
        A category without a public library returns 404 for everyone except
        its owner. A malformed id is a 404 too.
      parameters:
        - $ref: "#/components/parameters/CategoryIDPath"
      responses:
        "200":
          description: Category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Rename a category or change its description
      description: |-
        Owner-only. The id never changes. Categories are otherwise created and
        removed with their libraries; there is no create or delete.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/CategoryIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateCategoryRequest"
      responses:
        "200":
          description: Category updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CategoryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /categories/{category_id}/libraries:
    get:
      summary: List libraries in a category
      description: |-
        The category owner sees public and private libraries; everyone else
        sees only public libraries. Ordered by updated_at DESC then id ASC.
      parameters:
        - $ref: "#/components/parameters/CategoryIDPath"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
      responses:
        "200":
          description: Libraries visible to the caller
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /libraries/{library_id}:
    get:
      summary: Get one library
      description: Private libraries return 404 for everyone except the owner.
      parameters:
        - $ref: "#/components/parameters/LibraryIDPath"
      responses:
        "200":
          description: Library
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "404":
          $ref: "#/components/responses/Error"
    patch:
      summary: Update a library or move it to another category
      description: |-
        Only the owner may update a library. category moves it to the owner's
        category with that name, created when missing (409 CATEGORY_LIMIT when
        that would be the 21st); a category left without libraries is removed
        in the same transaction. The library id and URL do not change.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LibraryIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateLibraryRequest"
      responses:
        "200":
          description: Library updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /libraries/{library_id}/versions:
    get:
      summary: List library version summaries
      description: |-
        Summaries never include source_code. Ordered by version_number DESC.
      parameters:
        - $ref: "#/components/parameters/LibraryIDPath"
        - $ref: "#/components/parameters/LimitQuery"
        - $ref: "#/components/parameters/OffsetQuery"
      responses:
        "200":
          description: Version summaries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryVersionListResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    post:
      summary: Create an immutable library version
      description: |-
        The version number is assigned by the system starting at 1. Version
        content can never be changed or deleted afterwards. The library's
        updated_at is bumped in the same transaction.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LibraryIDPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateLibraryVersionRequest"
      responses:
        "201":
          description: Version created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryVersionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
        "409":
          $ref: "#/components/responses/Error"
  /libraries/{library_id}/versions/{version_number}:
    get:
      summary: Get one library version with its source
      parameters:
        - $ref: "#/components/parameters/LibraryIDPath"
        - $ref: "#/components/parameters/VersionNumberPath"
      responses:
        "200":
          description: Library version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryVersionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
  /libraries/{library_id}/versions/{version_number}/submission-url:
    put:
      summary: Set or replace a version's related submission URL
      description: >-
        Set the self-declared "related submission" URL of one library version,
        replacing any previous value. Only the library owner may call this;
        other users get 403 on a public library and 404 on a private one. The
        URL must be an absolute HTTP(S) URL with a host, at most 2048 bytes, and
        without control characters. Surrounding whitespace is trimmed and the
        scheme is lowercased. The version's source code and the library's
        updated_at are unchanged.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LibraryIDPath"
        - $ref: "#/components/parameters/VersionNumberPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetSubmissionURLRequest"
      responses:
        "200":
          description: Updated library version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LibraryVersionResponse"
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"
    delete:
      summary: Remove a version's related submission URL
      description: >-
        Clear the submission URL of one library version. Owner-only, with the
        same 403/404 rules as PUT. Clearing a version without a URL succeeds.
      security:
        - CookieAuth: []
      parameters:
        - $ref: "#/components/parameters/LibraryIDPath"
        - $ref: "#/components/parameters/VersionNumberPath"
      responses:
        "204":
          description: Submission URL removed
        "400":
          $ref: "#/components/responses/Error"
        "401":
          $ref: "#/components/responses/Error"
        "403":
          $ref: "#/components/responses/Error"
        "404":
          $ref: "#/components/responses/Error"

components:
  parameters:
    UserIDHeader:
      name: X-User-ID
      in: header
      required: false
      description: Development-only authentication header enabled by DEV_HEADER_AUTH=true.
      schema:
        type: string
        format: uuid
    UserRoleHeader:
      name: X-User-Role
      in: header
      required: false
      description: Development-only authentication header enabled by DEV_HEADER_AUTH=true.
      schema:
        type: string
        enum: [user, author, admin]
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        Optional opaque key for safe request retry. The same key with the same
        normalized request body replays the same execution. A blank or
        whitespace-only key is rejected with `400`. Keys are retained
        indefinitely in the current implementation.
      schema:
        type: string
        minLength: 1
        maxLength: 255
    GroupIDPath:
      name: group_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    ProblemIDPath:
      name: problem_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    TestCaseIDPath:
      name: test_case_id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    HandlePath:
      name: handle
      in: path
      required: true
      schema:
        type: string
    CategoryIDPath:
      name: category_id
      in: path
      required: true
      description: The category id (20 lowercase hex characters).
      schema:
        type: string
    LibraryIDPath:
      name: library_id
      in: path
      required: true
      description: The library id (20 lowercase hex characters).
      schema:
        type: string
    VersionNumberPath:
      name: version_number
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    LimitQuery:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    OffsetQuery:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
  securitySchemes:
    CookieAuth:
      type: apiKey
      in: cookie
      name: tag_judge_session
  responses:
    Error:
      description: Error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    RateLimitError:
      description: Per-user rate or outstanding execution limit exceeded
      headers:
        Retry-After:
          description: |
            Estimated integer seconds before the request may succeed. For the
            rolling rate limit this is based on the oldest accepted request in
            the window; for the outstanding limit it is an estimate.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    ServiceUnavailableError:
      description: |
        Either the global outstanding execution limit is exceeded
        (`GLOBAL_OUTSTANDING_LIMIT_EXCEEDED`) or the database/admission lock is
        temporarily unavailable (`TRANSIENT_DATABASE_ERROR`,
        `TRANSIENT_COMMIT_FAILURE`). Both cases include an integer `Retry-After`
        header.
      headers:
        Retry-After:
          description: Estimated integer seconds before the request may succeed.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    CreateProblemRequest:
      type: object
      additionalProperties: false
      required:
        - title
        - statement
        - time_limit_ms
        - memory_limit_kb
        - visibility
      properties:
        title:
          type: string
          minLength: 1
        statement:
          type: string
          minLength: 1
          description: Markdown or TeX source stored without transformation.
        time_limit_ms:
          type: integer
          minimum: 1
          maximum: 2147483647
        memory_limit_kb:
          type: integer
          minimum: 1
          maximum: 2147483647
        visibility:
          type: string
          enum: [private, group]
          description: Add at least one test case before changing visibility to public.
    UpdateProblemRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
        statement:
          type: string
          minLength: 1
        time_limit_ms:
          type: integer
          minimum: 1
          maximum: 2147483647
        memory_limit_kb:
          type: integer
          minimum: 1
          maximum: 2147483647
        visibility:
          type: string
          enum: [public, private, group]
    CreateTestCaseRequest:
      type: object
      additionalProperties: false
      required: [input, expected_output, is_sample]
      properties:
        input:
          type: string
        expected_output:
          type: string
        is_sample:
          type: boolean
    UpdateTestCaseRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        input:
          type: string
        expected_output:
          type: string
        is_sample:
          type: boolean
    TestCase:
      type: object
      required: [id, problem_id, input, expected_output, is_sample, score, created_at]
      properties:
        id:
          type: integer
          format: int64
        problem_id:
          type: integer
          format: int64
        input:
          type: string
        expected_output:
          type: string
        is_sample:
          type: boolean
        score:
          type: integer
          minimum: 1
        created_at:
          type: string
          format: date-time
    TestCaseResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/TestCase"
    TestCaseListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/TestCase"
    CreateGroupRequest:
      type: object
      additionalProperties: false
      required:
        - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 2000
          default: ""
    AddGroupMemberRequest:
      type: object
      additionalProperties: false
      required:
        - user_id
        - role
      properties:
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [member, owner]
    Group:
      type: object
      required:
        - id
        - name
        - description
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    GroupMember:
      type: object
      required:
        - group_id
        - user_id
        - role
        - created_at
      properties:
        group_id:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
        role:
          type: string
          enum: [member, owner]
        created_at:
          type: string
          format: date-time
    GroupResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Group"
    GroupListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Group"
    GroupMemberResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/GroupMember"
    Problem:
      type: object
      required:
        - id
        - title
        - statement
        - time_limit_ms
        - memory_limit_kb
        - visibility
        - created_by
        - created_at
        - updated_at
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        statement:
          type: string
        time_limit_ms:
          type: integer
        memory_limit_kb:
          type: integer
        visibility:
          type: string
          enum: [public, private, group]
        created_by:
          type: [string, "null"]
          description: The creator's handle, or null when they have none.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ProblemResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Problem"
    Me:
      type: object
      required:
        - user_id
        - role
        - handle
      properties:
        user_id:
          type: string
          format: uuid
          description: The caller's own id.
        role:
          type: string
          enum: [user, author, admin]
        handle:
          type: [string, "null"]
          description: Null until the caller creates their handle.
    MeResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Me"
    ProblemListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Problem"
    CreateCodeRunRequest:
      type: object
      additionalProperties: false
      required:
        - language
        - source_code
      properties:
        language:
          type: string
          enum: [python]
        source_code:
          type: string
          minLength: 1
        stdin:
          type: string
          default: ""
    CodeRun:
      type: object
      required:
        - id
        - user_id
        - language
        - source_code
        - stdin
        - stdout
        - stderr
        - status
        - execution_time_ms
        - memory_kb
        - created_at
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
        language:
          type: string
          enum: [python]
        source_code:
          type: string
        stdin:
          type: string
        stdout:
          type: string
        stderr:
          type: string
        status:
          type: string
          enum: [pending, running, ac, tle, re, ie]
        execution_time_ms:
          type: [integer, "null"]
          minimum: 0
        memory_kb:
          type: [integer, "null"]
          minimum: 0
        created_at:
          type: string
          format: date-time
    CodeRunResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/CodeRun"
    CodeRunListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/CodeRun"
    CreateSubmissionRequest:
      type: object
      additionalProperties: false
      required:
        - language
        - source_code
      properties:
        language:
          type: string
          enum: [python]
        source_code:
          type: string
          minLength: 1
    Submission:
      type: object
      required:
        - id
        - user_id
        - problem_id
        - language
        - source_code_key
        - status
        - score
        - created_at
        - judged_at
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
        problem_id:
          type: integer
          format: int64
        language:
          type: string
          enum: [python]
        source_code_key:
          type: string
        status:
          type: string
          enum: [pending, running, ac, wa, tle, mle, re, ce, ie]
        score:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        judged_at:
          type: [string, "null"]
          format: date-time
    SubmissionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Submission"
    SubmissionCaseResult:
      type: object
      additionalProperties: false
      required: [test_case_id, status, execution_time_ms, memory_kb]
      properties:
        test_case_id:
          type: integer
          format: int64
        status:
          type: string
          enum: [ac, wa, tle, mle, re, ce, ie]
        execution_time_ms:
          type: [integer, "null"]
          minimum: 0
          description: Execution time in milliseconds, or null if not recorded. Zero is a valid recorded value.
        memory_kb:
          type: [integer, "null"]
          minimum: 0
          description: Memory usage in KiB, or null if not recorded. The current worker does not record this metric.
    SubmissionDetail:
      allOf:
        - $ref: "#/components/schemas/Submission"
        - type: object
          required: [case_results]
          properties:
            case_results:
              type: array
              description: |
                Saved results ordered by test_case_id ascending. Empty for pending/running
                submissions or when no cases ran (for example an early internal error).
                Cases not executed after an early failure are omitted.
              items:
                $ref: "#/components/schemas/SubmissionCaseResult"
    SubmissionDetailResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/SubmissionDetail"
    SubmissionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Submission"
    PublicSubmission:
      type: object
      required: [id, problem_id, problem_title, language, status, score, created_at, judged_at, submitter]
      properties:
        id:
          type: integer
          format: int64
        problem_id:
          type: integer
          format: int64
        problem_title:
          type: string
        language:
          type: string
          enum: [python]
        status:
          type: string
          enum: [pending, running, ac, wa, tle, mle, re, ce, ie]
        score:
          type: integer
          minimum: 0
        created_at:
          type: string
          format: date-time
        judged_at:
          type: [string, "null"]
          format: date-time
        submitter:
          type: [string, "null"]
          description: The submitter's handle, or null when they have none.
    PublicSubmissionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PublicSubmission"
    CreateProfileRequest:
      type: object
      required: [handle]
      additionalProperties: false
      properties:
        handle:
          type: string
          pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$"
          minLength: 2
          maxLength: 32
    UserProfile:
      type: object
      required: [handle]
      properties:
        handle:
          type: string
    UserProfileResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/UserProfile"
    UpdateCategoryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
          maxLength: 500
    Category:
      type: object
      required: [id, owner, name, description, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{20}$"
          description: Random id assigned by the system; never changes.
        owner:
          type: string
          description: The owner's handle.
        name:
          type: string
        description:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CategoryResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Category"
    CategoryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Category"
    CreateLibraryRequest:
      type: object
      required: [name, category, visibility]
      additionalProperties: false
      properties:
        category:
          type: string
          minLength: 1
          maxLength: 64
          description: Name of the caller's category to file the library under; created when missing.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: Free text, trimmed. May repeat.
        description:
          type: string
          maxLength: 2000
        visibility:
          type: string
          enum: [public, private]
    UpdateLibraryRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          maxLength: 2000
        visibility:
          type: string
          enum: [public, private]
        category:
          type: string
          minLength: 1
          maxLength: 64
          description: Moves the library to the owner's category with this name, created when missing.
    Library:
      type: object
      required: [id, owner, category, name, description, visibility, created_at, updated_at]
      properties:
        id:
          type: string
          pattern: "^[0-9a-f]{20}$"
          description: Random id assigned by the system; never changes.
        owner:
          type: string
          description: The owner's handle.
        category:
          type: object
          required: [id, name]
          properties:
            id:
              type: string
            name:
              type: string
        name:
          type: string
        description:
          type: string
        visibility:
          type: string
          enum: [public, private]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Bumped by a library update or move, or a new version; not by a submission URL change.
    LibraryResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/Library"
    LibraryListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/Library"
    CreateLibraryVersionRequest:
      type: object
      required: [source_code]
      additionalProperties: false
      properties:
        source_code:
          type: string
          minLength: 1
          maxLength: 100000
    LibraryVersion:
      type: object
      required: [id, version_number, source_code, content_sha256, byte_size, created_at, submission_url, submission_url_updated_at]
      properties:
        id:
          type: string
        version_number:
          type: integer
        source_code:
          type: string
        content_sha256:
          type: string
        byte_size:
          type: integer
        created_at:
          type: string
          format: date-time
        submission_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: Related submission URL self-declared by the library owner (not verified); null when unset.
        submission_url_updated_at:
          type: [string, "null"]
          format: date-time
    LibraryVersionSummary:
      type: object
      required: [id, version_number, content_sha256, byte_size, created_at, submission_url, submission_url_updated_at]
      properties:
        id:
          type: string
        version_number:
          type: integer
        content_sha256:
          type: string
        byte_size:
          type: integer
        created_at:
          type: string
          format: date-time
        submission_url:
          type: [string, "null"]
          format: uri
          maxLength: 2048
          description: Related submission URL self-declared by the library owner (not verified); null when unset.
        submission_url_updated_at:
          type: [string, "null"]
          format: date-time
    LibraryVersionResponse:
      type: object
      required: [data]
      properties:
        data:
          $ref: "#/components/schemas/LibraryVersion"
    LibraryVersionListResponse:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/LibraryVersionSummary"
    SetSubmissionURLRequest:
