[package]
name = "judge-worker"
version = "0.1.0"
edition = "2024"

[dependencies]
aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-sdk-sqs = { version = "1", default-features = false, features = ["rustls", "rt-tokio"] }
aws-smithy-runtime = { version = "1", features = ["connector-hyper-0-14-x", "rt-tokio", "tls-rustls"] }
hyper-rustls = { version = "0.24", default-features = false, features = ["webpki-tokio", "http1", "http2", "tls12"] }
judge-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
